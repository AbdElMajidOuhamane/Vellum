name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Fairyfly
        run: |
          curl -fsSL https://raw.githubusercontent.com/AbdElMajidOuhamane/ff/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Fairyfly
        run: ff --version

      - name: Install Flow
        run: npm install -g flow-bin@0.279.0

      - name: Install dependencies
        run: npm ci

      - name: Flow
        run: npm run check:flow

      - name: Runtime tests
        run: npm test

      - name: Build documentation site
        run: npm run build

      - name: Validate content and links
        run: npm run check:content

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: vellum-site
          path: site/dist
          if-no-files-found: error
